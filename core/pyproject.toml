[project]
name = "taskasion-core"
version = "1.0.1-aStart"
description = "Taskasion core: local-first task store + REST + MCP server + agent audit"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
taskasion-core = "taskasion_core.__main__:main"
taskasion-mcp = "taskasion_core.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["taskasion_core*"]
