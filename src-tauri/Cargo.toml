[package]
name = "taskasion"
version = "1.1.0-beta.2"
description = "Taskasion: floating task widget with agent management"
license = "MIT"
edition = "2021"
rust-version = "1.85"

# 产物名与品牌一致;crate 名保持小写(crates.io 约定),两者不冲突
[[bin]]
name = "Taskasion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 直接 cargo build --release 时也必须内嵌 dist 而不是加载 devUrl,
# 否则没有 vite dev server 在跑就会报“localhost 拒绝连接”。
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# core 内置后的直接依赖:taskasion_core 用(此前经 Python uuid4/datetime 提供)
uuid = { version = "1.26", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
